<div class="card mt-5 shadow-sm border-0 rounded-4">
  <div class="card-body p-4">
    <h4 class="fw-bold mb-2 headingComment">Leave a Comment</h4>
    <p class="text-muted mb-4">
      We'd love to hear your thoughts! Please fill out the form below to share
      your comment.
    </p>

    <form>
      <div class="mb-3">
        <label class="form-label fw-semibold heading">Name</label>
        <input
          type="text"
          class="form-control form-control-lg rounded-3"
          placeholder="Enter your full name..."
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold heading">Comment</label>
        <textarea
          rows="5"
          class="form-control form-control-lg rounded-3"
          placeholder="Write your comment here..."
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg rounded-3 px-4">
        <i class="bi bi-send-fill me-1"></i> Submit Comment
      </button>
    </form>
  </div>
</div>
