<div class="card subscription-card mx-auto my-5 p-4">
  <div class="card-body text-center">
    <h3 class="mb-2">Subscribe to Our Newsletter</h3>
    <p class="subs-text mx-auto mb-4">
      Get the latest blog posts and updates delivered directly to your inbox.
    </p>

    <form class="row g-3 justify-content-center align-items-center">
      <div class="col-md-5">
        <input
          type="text"
          class="form-control form-input"
          placeholder="Your Name"
        />
      </div>
      <div class="col-md-5">
        <input
          type="email"
          class="form-control form-input"
          placeholder="Your Email"
        />
      </div>
      <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-sub">Subscribe</button>
      </div>
    </form>
  </div>
</div>
