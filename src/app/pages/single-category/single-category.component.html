<div class="bg-theme p-5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8 text-start">
        <h1 class="text-white fw-bold mb-3">
          {{ categoryPost[0]?.category?.name }}
        </h1>
        <p class="text-white-50 fs-5">
          Expand your understanding of the world with handpicked facts,
          articles, and insights that keep your mind sharp and curious.
        </p>
      </div>
    </div>
  </div>
</div>

<div class="container py-5">
  <div class="row g-4">
    <div class="col-md-4 col-sm-6" *ngFor="let item of categoryPost">
      <app-post-card [post]="item"></app-post-card>
    </div>
  </div>
</div>
