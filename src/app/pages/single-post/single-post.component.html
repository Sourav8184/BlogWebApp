<div class="post-detail-wrapper py-5" *ngIf="post">
  <div class="container">
    <div class="row g-5">
      <!-- Main Blog Post -->
      <div class="col-lg-9">
        <article
          class="blog-detail-card shadow-sm border-0 rounded-4 overflow-hidden bg-white"
        >
          <div class="post-image-wrapper position-relative">
            <img
              [src]="post.imagePath"
              [alt]="post.title"
              class="img-fluid w-100 post-image"
            />
            <div class="image-overlay"></div>
            <div
              class="post-category-badge position-absolute top-0 start-0 m-3"
            >
              <span class="badge bg-primary px-3 py-2">
                {{ post.category.name }}
              </span>
            </div>
          </div>

          <div class="card-body px-5 py-4">
            <div class="d-flex flex-wrap gap-2 mb-3">
              <span class="badge bg-light text-danger">
                {{ post.category.name }}
              </span>

              <span class="badge bg-light text-success">
                {{ post.isFeatured ? "Featured" : "Latest" }}
              </span>

              <span class="badge bg-light text-info">
                Views – {{ post.views }}
              </span>

              <span class="badge bg-light text-warning">
                Updated – {{ post.createdAt | date: "mediumDate" }}
              </span>
            </div>

            <h1 class="post-title fw-bold mt-3 mb-3">
              {{ post.title }}
            </h1>

            <p class="lead text-muted mb-4">
              {{ post.excerpt }}
            </p>

            <div [innerHTML]="post.content"></div>
          </div>
        </article>

        <app-comment-form></app-comment-form>
        <app-comment-list></app-comment-list>
      </div>

      <!-- Sidebar -->
      <aside class="col-lg-3">
        <div class="sidebar-card p-4 shadow-sm rounded-4 bg-white sticky-top">
          <h5 class="fw-bold mb-4 text-primary border-bottom pb-2">
            Related Posts
          </h5>

          <div class="related-posts">
            <div *ngFor="let item of [1, 2]" class="mb-4">
              <app-post-card></app-post-card>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>
